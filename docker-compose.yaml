
services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: coach-db
    environment:
      POSTGRES_USER: ${COACH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${COACH_DB_PASSWORD:-123}
      POSTGRES_DB: ${COACH_DB_NAME:-ai_coach}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COACH_DB_USER:-postgres} -d ${COACH_DB_NAME:-ai_coach}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitness_migrations
    environment:
      - DATABASE_URL=postgresql+asyncpg://${COACH_DB_USER:-postgres}:${COACH_DB_PASSWORD:-123}@postgres:5432/${COACH_DB_NAME:-ai_coach}
    command: alembic upgrade head
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy  
    networks:
      - app_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitness_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - venv_data:/app/.venv
    environment:
      - DATABASE_URL=postgresql+asyncpg://${COACH_DB_USER:-postgres}:${COACH_DB_PASSWORD:-123}@postgres:5432/${COACH_DB_NAME:-ai_coach}
    depends_on:
      migrations:
        condition: service_completed_successfully 
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - app_network
    
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app_network

volumes:
  pg_data:
  prometheus_data:
  grafana_data:
  venv_data:

networks:
  app_network:
    driver: bridge